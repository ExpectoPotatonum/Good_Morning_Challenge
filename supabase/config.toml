project_id = "good-morning-challenge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
schema_paths = ["./supabase/migrations"]

[db.seed]
# The 21 October initial-report rows are seeded by
# supabase/migrations/20261021000001_seed_data.sql, so `supabase db reset`
# already produces a fully seeded database. No extra seed files are needed.
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[analytics]
enabled = false
